server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Live-rewind buffer: the playlist changes every few seconds, never cache it.
    location /media/live/ {
        alias /usr/share/nginx/media/live/;
        add_header Cache-Control "no-cache";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/iso.segment m4s;
            video/mp4 mp4;
        }
        default_type application/octet-stream;
    }

    # Served straight from the shared media volume: supports Range requests, so
    # long recordings start fast and can be seeked without downloading it all.
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Accept-Ranges bytes;
        types {
            video/mp4 mp4;
            image/jpeg jpg jpeg;
            image/png png;
            audio/mpeg mp3;
            audio/wav wav;
            audio/mp4 m4a;
        }
        default_type application/octet-stream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
